rule_set_id: archaea_general
description: Safe initial archaeal tRNA modification rules. These boost candidates but do not force calls.
position_rules:
- id: archaea_G15_archaeosine
  standard_positions:
  - 15
  bases:
  - G
  preferred_modifications:
  - archaeosine
  - preQ0
  - preQ1
  - Gplus
  score_boost: 2.0
  position_penalty_if_unlisted: 0.8
  allow_unknown: false
  unknown_score_boost: 1.0
  notes: Archaeosine-related rule; keep broad because exact species-specific status may require literature confirmation.
