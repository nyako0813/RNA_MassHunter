project:
  name: RNA_MassHunter_v2
  output_dir: output
  log_dir: logs
  cache_dir: .cache
input:
  raw_path: ''
  mzml_path: '/mnt/c/Users/nyako/OneDrive - 国立大学法人東海国立大学機構/研究室関連/その他/ms/Mass/260424/05 old T1.mzML'
  msconvert_path: ''
organism:
  group: archaea
  species: Methanosarcina acetivorans
  rule_set: methanosarcina_acetivorans
sequence:
  name: MA_tRNA^Gln-UUG
  type: RNA
  sequence: 'GCUCCGGUAGUGUAGUCCGGCCAAUCAUUCCGGCCUUUCGAGCCGAAGACUCGGGUUCGAAUCCCGGCCGGAGCACCA'
  anticodon: 'UUC'
  wobble_position: 37
experiment:
  condition_name: wild_type
  knocked_out_genes: []
  complemented_genes: []
  overexpressed_genes: []
  artificial_modifications: []
  genotype_effects: []
instrument:
  polarity: negative
  ms1_tolerance_ppm: 10
  ms2_tolerance_da: 0.02
reconstruction:
  # For RNase_T1 / RNase digestion fragment analysis, set enabled: false
  # to omit full-length intact reconstruction sheets from the Excel report.
  enabled: false
  rt_min: null
  rt_max: null
  mz_min: 500
  mz_max: 3000
  intensity_threshold: 1000
  min_charge: 5
  max_charge: 40
  min_charge_states: 3
  mass_cluster_tolerance_da: 1.0
  max_charge_state_peak_rows: 100000
# Set digestion.enabled to false for intact/full-length-only analysis.
# In that mode, theoretical fragments and Fragment_MS1 sheets are skipped,
# while intact mass reconstruction still runs when reconstruction.enabled is true.
digestion:
  # For T1 digestion fragment analysis, use enabled: true with enzyme: RNase_T1.
  enabled: true
  enzyme: RNase_T1
  digestion_mode: specific
  missed_cleavages: 1
  min_length: 2
  max_length: null
  include_terminal_forms: true
  allow_partial_digestion: true
  allow_nonspecific_cleavage: false
# Record whether the sample was treated with alkaline phosphatase.
# If enabled=true and assume_complete=true, only dephosphorylated terminal forms are generated.
# If enabled=true and assume_complete=false, residual/cyclic phosphate candidates can be retained.
alkaline_phosphatase:
  enabled: false
  assume_complete: false
  allow_residual_phosphate: true
  allow_cyclic_phosphate: true
alkaline_phosphatase:
  enabled: false
  assume_complete: false
  allow_residual_phosphate: true
  allow_cyclic_phosphate: true
cca_tail:
  enabled: true
  excludes_cca_candidate_states: [NONE, C, CC, CCA]
  includes_cca_candidate_states: [CCA, CC]
  default_status: ASSUMED   # ASSUMED か UNKNOWN のみ指定可(CONFIRMEDはconfigからは設定不可)
cca_processing:
  enabled: true
fragment_mapping:
  # Keep enabled for RNase digestion fragment MS1 matching.
  enabled: true
  mz_tolerance_ppm: 10
  min_charge: 1
  max_charge: 8
  polarity: auto
  use_peak_tiers: true
  include_trace_peaks: true
  max_matches_per_fragment: 20
  min_fragment_length_for_filtered: 3
  filtered_peak_tiers:
    - Major
    - Minor
  filtered_confidence:
    - High
    - Medium
  summary_best_match_by: fragment_id
p1_annotation:
  # Used only when digestion.enzyme is P1 / Nuclease_P1.
  enabled: false
  include_unmatched_peaks: true
  include_modified_monomers: true
  include_phosphate_forms: true
  mz_tolerance_ppm: 10
  min_intensity: 0
  charge_states: [1]

ms2_annotation:
  enabled: true
  mz_tolerance_ppm: 20
  min_peak_intensity: 10
  min_relative_intensity_percent: 1.0
  max_peaks_per_spectrum: 500
  precursor_match_tolerance_ppm: 20
  constrain_by_precursor: true
  fallback_to_all_ions_if_no_precursor_match: false
  use_theoretical_fragments: true
  ion_series: [d, w, a, z]
  include_neutral_loss: false
  include_base_loss: false
  base_loss_min_ion_length: 2
  base_loss_max_rows: 50000
  base_loss_include_precursor: true
  min_ion_length: 1
  max_ion_length: null
  min_ion_length_for_evidence: 2
  max_ms2_match_rows: 100000
  max_unmatched_peaks: 50000
  output_unmatched_peaks: true
  output_low_intensity_peaks: false
  output_all_peak_annotations: false
  include_modified_precursor_candidates: true
  modified_precursor_source: known_modifications
  modified_precursor_max_mods_per_fragment: 1
  modified_precursor_require_base_compatibility: true
  modified_precursor_include_isobaric: false
  modified_precursor_mass_shift_tolerance_da: 1.0e-6
  modified_precursor_max_candidates_per_spectrum: 20
  include_modified_fragment_ions: true
  modified_fragment_ion_source: modified_precursor_candidates
  modified_fragment_max_positions_per_candidate: 20
  modified_fragment_require_target_base: true
  modified_fragment_include_unmodified_counterparts: true
  modified_fragment_min_ion_length: 1
  modified_fragment_min_ion_length_for_localization: 2
  modified_fragment_output_all_position_candidates: true
  modified_fragment_max_rows: 100000
  annotate_position_discriminating_ions: true

modification_evidence_ranking:
  enabled: true
  use_ms1_fragment_evidence: true
  use_known_modification_candidates: true
  use_ms2_precursor_evidence: true
  use_ms2_modified_ion_evidence: true
  use_localization_evidence: true
  use_organism_rules: true
  use_trna_context: true
  require_ms2_evidence_for_high_confidence: true
  use_biological_context: true
  cap_context_only_confidence: Medium
  require_ms_evidence_for_context_boosted_high: true
  enable_ambiguity_grouping: true
  ambiguity_group_by:
    - Spectrum_ID
    - Parent_Fragment_ID
    - Modification_ID
  require_position_discriminating_ions_for_localization_confidence: true
  min_discriminating_ions_for_position_support: 1
  min_informative_discriminating_ions_for_high: 2
  collapse_ambiguous_positions_in_summary: true
  min_final_score_to_report: 0
  max_ranked_candidates: 10000
  weights:
    ms1_fragment_match: 1.0
    known_modification_candidate: 1.0
    ms2_precursor_rescue: 2.0
    ms2_modified_ion_match: 2.0
    localization_weak: 1.0
    localization_moderate: 3.0
    localization_strong: 5.0
    organism_rule_supported: 1.5
    trna_context_supported: 1.0
    low_information_penalty: -1.0
    ambiguous_position_penalty: -1.0
    isobaric_precursor_penalty: -2.0
    ambiguity_penalty: -1.5
    non_discriminating_ion_penalty: -0.5
    curation_manually_checked: 0.5
    source_user_pdf: 0.5
    detectability_ms2_supported: 0.5

biological_context:
  enabled: true
  organism_group: ""
  organism_species: ""
  trna_name: ""
  trna_type: ""
  anticodon: ""
  focus_positions: []
  focus_position_window: 2
  priority_modifications: []
  priority_keywords: []
  boost:
    organism_rule_supported: 1.0
    pathway_supported: 1.0
    priority_modification: 1.5
    priority_keyword_match: 0.75
    focus_position_match: 1.0
    focus_position_nearby: 0.5
    trna_context_supported: 1.0
  penalties:
    organism_context_conflict: -2.0
    unrelated_modification_family: -0.5

peak_filtering:
  strategy: tiered
  major_intensity_threshold: 25000
  minor_intensity_threshold: 5000
  trace_intensity_threshold: 1000
  report_trace_peaks: true
  use_trace_peaks_for_final_call: true
  trace_peak_score_penalty: 0.3
performance:
  mode: balanced
  n_workers: auto
  cache_enabled: true
  checkpoint_enabled: true
  resume_from_checkpoint: true
reporting:
  excel_output: true
  summary_top_n: 3
  detail_top_n: 10
  debug_all_candidates: false
  max_excel_rows_per_sheet: 100000
  truncate_large_sheets: true
  max_charge_state_peak_rows: 100000
modification_search:
  # Keep enabled for known modification candidate search from fragment MS1 matches.
  enabled: true
  source:
    use_fragments: true
    use_intact: false
  mz_tolerance_ppm: 10
  max_candidates_per_match: 10
  include_isobaric_modifications: false
  isobaric_mass_shift_tolerance_da: 1e-6
  require_base_compatibility: true
  allow_unknown_position_within_fragment: true
  report_unmodified_explained: false
  min_peak_tier:
    - Major
    - Minor
  min_confidence:
    - High
    - Medium
unknown_modification_search:
  enabled: true
  include_known_modification_composites: true   # これがCompound探索のON/OFF
  mz_tolerance_ppm: 10.0
  max_candidates_per_match: 10
  min_peak_tier: ["Major", "Minor"]
  min_confidence: ["High", "Medium"]
  source:
    use_fragments: true
    use_intact: false
  candidate_deltas:
    - label: "+O"
      elements: {O: 1}
    - label: "+S"
      elements: {S: 1}
    - label: "O→S"
      elements: {O: -1, S: 1}
    - label: "+CH2"
      elements: {C: 1, H: 2}
    - label: "-H2O"
      elements: {H: -2, O: -1}
    - label: "+CH2O2"
      elements: {C: 1, H: 2, O: 2}