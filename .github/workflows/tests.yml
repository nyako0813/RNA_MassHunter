name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validated dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: CLI help smoke test
        env:
          PYTHONPATH: .
        run: python -m rna_masshunter.sciex_cross_layer_bundle_cli --help
      - name: Run synthetic and unit test suite
        env:
          PYTHONPATH: .
        run: pytest -q
